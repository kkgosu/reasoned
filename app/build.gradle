plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.kkgosu.learnharness'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.kkgosu.learnharness"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appkit
    implementation libs.litex.recyclerview
    implementation libs.coroutines.android
    implementation libs.okhttp
    implementation libs.nimbus
    implementation libs.markwon.core
    implementation libs.markwon.inline
    implementation libs.markwon.latex
    implementation(libs.drawer) {
        // LiteX already supplies the same androidx.collection classes.
        exclude group: 'androidx.collection', module: 'collection'
    }
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.junit
}