plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.kkgosu.reasoned'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.kkgosu.reasoned"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            optimization {
                enable true
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appkit
    implementation libs.litex.recyclerview
    implementation libs.coroutines.android
    implementation libs.okhttp
    implementation libs.jsoup
    implementation libs.nimbus
    implementation libs.markwon.core
    implementation libs.markwon.inline
    implementation libs.markwon.latex
    implementation libs.markwon.tables
    implementation(libs.drawer) {
        // LiteX already supplies the same androidx.collection classes.
        exclude group: 'androidx.collection', module: 'collection'
    }
    testImplementation libs.junit
    // Android's org.json is a stub in local JVM tests; use a real implementation.
    testImplementation libs.json
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.junit
}