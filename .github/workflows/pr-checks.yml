name: PR checks

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}

      - name: Verify pinned LearnHarness sources
        working-directory: app/src/main/assets/learnharness
        run: sha256sum --check SOURCE.sha256

      - name: Compile and lint both variants
        run: >-
          ./gradlew --stacktrace --console=plain --continue
          :app:assembleDebug :app:assembleRelease
          :app:lintDebug :app:lintRelease

      - name: Run JVM unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew --stacktrace --console=plain :app:testDebugUnitTest

      - name: Verify sample screens are removed from release
        run: python3 scripts/check-release-samples.py

      - name: Upload build reports and debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-reports-and-debug-apk
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
            app/build/outputs/apk/debug/app-debug.apk
